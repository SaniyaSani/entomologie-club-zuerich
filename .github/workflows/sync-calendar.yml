name: Kalender synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ICS-Kalender herunterladen
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: |
          set -euo pipefail
          test -n "$ICS_URL"
          curl --fail --location --retry 3 "$ICS_URL" -o data/calendar.ics.tmp
          grep -q "BEGIN:VCALENDAR" data/calendar.ics.tmp
          mv data/calendar.ics.tmp data/calendar.ics

      - name: Aktualisierung speichern
        run: |
          if git diff --quiet -- data/calendar.ics; then
            echo "Keine Kalenderänderung."
            exit 0
          fi
          git config user.name "entoclub-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.ics
          git commit -m "Kalender automatisch aktualisieren"
          git push
